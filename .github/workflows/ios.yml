name: Build VESC Tool iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.7.2'
          target: 'ios'
          arch: 'config'

      - name: Build Xcode Project
        run: |
          mkdir build && cd build
          qt-cmake .. -G Xcode -DCMAKE_SYSTEM_NAME=iOS
          cmake --build . --config Release

      - name: Package IPA
        run: |
          mkdir -p Payload
          mv build/Release-iphoneos/vesc_tool.app Payload/ 2>/dev/null || mv build/vesc_tool.app Payload/
          zip -r vesc_tool.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vesc-tool-ios-ipa
          path: vesc_tool.ipa
